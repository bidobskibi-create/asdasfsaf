
name: SwipeNav v19 Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android tools
        run: sdkmanager --install "platforms;android-19" "build-tools;34.0.0"

      - name: Build SwipeNav v19
        run: |
          cd SwipeNav-project-v19
          bash ./build.sh
          test -s out/SwipeNav-flash.zip

      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: SwipeNav-v19-flash
          path: SwipeNav-project-v19/out/SwipeNav-flash.zip
          if-no-files-found: error
